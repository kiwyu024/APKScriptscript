plugins { id 'com.android.application' }

android {
    namespace 'com.kiwyu.terraminebot'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kiwyu.terraminebot'
        minSdk 30          // AccessibilityService.takeScreenshot needs API 30
        targetSdk 35
        versionCode 7
        versionName '0.7'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideload-only build
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
