plugins { id 'com.android.application' }

android {
    namespace 'com.kiwyu.tapassist'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kiwyu.tapassist'
        minSdk 30          // AccessibilityService.takeScreenshot needs API 30
        // phones (arm64) and the Android Studio emulator (x86_64); keeps the text-recognition engine to two copies
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        targetSdk 35
        versionCode 25
        versionName '0.8.3.9'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideload-only build
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // on-device text recognition (bundled model, works offline) for the resource collector
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
